<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi - {% block title %}{% endblock %}</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --accent-primary: #3b82f6;
            --accent-secondary: #1d4ed8;
            --border-color: #e5e7eb;
        }
        .dark {
            --bg-primary: #1f2937;
            --bg-secondary: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --accent-primary: #3b82f6;
            --accent-secondary: #60a5fa;
            --border-color: #374151;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
        }
        .btn-primary {
            background-color: var(--accent-primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--accent-secondary);
        }
        input, textarea, select, pre, #text-preview {
            color: #000000 !important;
            background-color: #ffffff !important;
        }
        input::placeholder, textarea::placeholder {
            color: #6b7280 !important;
        }
        .dark input, .dark textarea, .dark select, .dark pre, .dark #text-preview {
            color: #000000 !important;
            background-color: #ffffff !important;
            border-color: #374151;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2 text-xl font-bold">
                <img src="/images/favicon.png" alt="Logo" class="h-8 w-8">
                <span>Aplikasi Web Kriptografi</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="/symmetric" class="hover:text-gray-300">Simetris</a>
                <a href="/asymmetric" class="hover:text-gray-300">Asimetris</a>
                <a href="/hybrid-signature" class="hover:text-gray-300">Tanda Tangan Hybrid</a>
                <a href="/hashing" class="hover:text-gray-300">Hashing</a>
                <a href="/caesar" class="hover:text-gray-300">Sandi Caesar</a>
                
                <!-- Theme Toggle -->
                <button id="themeToggle" class="p-1 rounded-full hover:bg-gray-700">
                    <!-- Sun icon for dark mode -->
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon icon for light mode -->
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 mt-8">
        <div class="container mx-auto text-center">
            <p>Aplikasi Web Kriptografi - Dibuat dengan Python dan Flask</p>
        </div>
    </footer>

    <!-- Tombol Scroll to Top -->
    <button id="scrollToTopBtn" class="fixed bottom-8 right-8 hidden w-12 h-12 flex items-center justify-center rounded-full bg-blue-500 text-white shadow-lg hover:bg-blue-700 transition">
        ↑
    </button>

    <!-- Scripts -->
    <script>
        // Theme Toggle
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.toggle('dark', currentTheme === 'dark');
        updateThemeIcons();

        document.getElementById('themeToggle').addEventListener('click', function() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', currentTheme);
            updateThemeIcons();
        });

        function updateThemeIcons() {
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            if (currentTheme === 'dark') {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // Scroll to Top
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 100) {
                scrollToTopBtn.classList.remove('hidden');
            } else {
                scrollToTopBtn.classList.add('hidden');
            }
        });
        scrollToTopBtn.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
